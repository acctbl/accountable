version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      day: monday
      interval: weekly
      time: "06:00"
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /
    schedule:
      day: monday
      interval: weekly
      time: "06:00"
    open-pull-requests-limit: 10
    groups:
      production-deps:
        dependency-type: production
      development-deps:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      day: monday
      interval: weekly
      time: "06:00"
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /
    schedule:
      day: monday
      interval: weekly
      time: "06:00"
    open-pull-requests-limit: 5

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      day: monday
      interval: weekly
      time: "06:00"
    open-pull-requests-limit: 5
