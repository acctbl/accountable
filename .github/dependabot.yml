version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      day: monday
      interval: weekly
      time: "06:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      day: monday
      interval: weekly
      time: "06:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
      
    groups:
      production-deps:
        dependency-type: production
      development-deps:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      day: monday
      interval: weekly
      time: "06:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      day: monday
      interval: weekly
      time: "06:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: terraform
    directory: /infra
    target-branch: develop
    schedule:
      day: monday
      interval: weekly
      time: "06:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
