version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      day: monday
      interval: monthly
      time: "06:00"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
      semver-major-days: 30

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      day: monday
      interval: monthly
      time: "06:00"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
      semver-major-days: 30
    groups:
      production-deps:
        dependency-type: production
      development-deps:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      day: monday
      interval: monthly
      time: "06:00"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      day: monday
      interval: monthly
      time: "06:00"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14

  - package-ecosystem: terraform
    directory: /infra/opentofu
    target-branch: develop
    schedule:
      day: monday
      interval: monthly
      time: "06:00"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
