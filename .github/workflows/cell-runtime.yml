name: Development cell runtime proof

on:
  workflow_dispatch:
    inputs:
      cell:
        description: Development cell root
        required: true
        type: choice
        options:
          - development-01
          - proof-01
      phase:
        description: Runtime proof phase
        required: true
        type: choice
        options:
          - prepare
          - edge-smoke
      revision:
        description: Deployed configuration revision
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: development-cell-${{ inputs.cell }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/require-green-ci.yml
    permissions:
      actions: read
      contents: read

  prove:
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: development
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ROLE_ARN: arn:aws:iam::453722413624:role/accountable-development-apply
      CELL: ${{ inputs.cell }}
      PHASE: ${{ inputs.phase }}
      REVISION: ${{ inputs.revision }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13

      - name: Install web dependencies
        if: inputs.phase == 'edge-smoke'
        run: |
          mise exec -- pnpm install --frozen-lockfile --ignore-scripts
          mise exec -- pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Request AWS apply identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const token = await core.getIDToken("sts.amazonaws.com");
            const tokenPath = path.join(process.env.RUNNER_TEMP, "aws-runtime-token");
            fs.writeFileSync(tokenPath, token, { mode: 0o600 });
            core.exportVariable("AWS_WEB_IDENTITY_TOKEN_FILE", tokenPath);

      - name: Initialise cell state
        run: |
          mise trust mise.toml
          mise exec -- tofu -chdir="infra/opentofu/environments/development/cells/$CELL" init -input=false

      - name: Prove live private posture
        run: |
          set -euo pipefail
          root="infra/opentofu/environments/development/cells/$CELL"
          mise exec -- tofu -chdir="$root" output -json | bash scripts/aws/prove-cell-posture.sh

      - name: Run bootstrap, migrate, and preflight
        if: inputs.phase == 'prepare'
        run: |
          set -euo pipefail
          root="infra/opentofu/environments/development/cells/$CELL"
          output="$(mise exec -- tofu -chdir="$root" output -json)"
          cluster="$(jq -r '.ecs_cluster_arn.value' <<<"$output")"
          subnets="$(jq -r '.application_subnet_ids.value | join(",")' <<<"$output")"
          bash scripts/aws/run-ecs-task.sh "$cluster" "$(jq -r '.bootstrap_task_definition_arn.value' <<<"$output")" "$subnets" "$(jq -r '.bootstrap_security_group_id.value' <<<"$output")"
          bash scripts/aws/run-ecs-task.sh "$cluster" "$(jq -r '.migrate_task_definition_arn.value' <<<"$output")" "$subnets" "$(jq -r '.migrate_security_group_id.value' <<<"$output")"
          bash scripts/aws/run-ecs-task.sh "$cluster" "$(jq -r '.preflight_task_definition_arn.value' <<<"$output")" "$subnets" "$(jq -r '.api_security_group_id.value' <<<"$output")"

      - name: Publish web release and prove the edge
        if: inputs.phase == 'edge-smoke'
        run: |
          set -euo pipefail
          root="infra/opentofu/environments/development/cells/$CELL"
          output="$(mise exec -- tofu -chdir="$root" output -json)"
          bucket="$(jq -r '.web_bucket_name.value' <<<"$output")"
          distribution="$(jq -r '.cloudfront_distribution_id.value' <<<"$output")"
          domain="$(jq -r '.cloudfront_domain.value' <<<"$output")"
          cell_url="https://$domain"
          mise exec -- pnpm --filter @accountable/web build
          runtime_source="$RUNNER_TEMP/web-runtime.toml"
          runtime_artifact="$(pwd)/apps/web/dist/_runtime/config.json"
          mkdir -p "$(dirname "$runtime_artifact")"
          printf 'environment = "development"\napi_base_url = "%s/api"\narchitecture_probe = true\n' "$cell_url" > "$runtime_source"
          mise exec -- go run ./cmd/webconfig --config "$runtime_source" --revision "$REVISION" --output "$runtime_artifact"
          aws s3 sync apps/web/dist "s3://$bucket" --delete --only-show-errors
          invalidation="$(aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*' --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$distribution" --id "$invalidation"
          ACCOUNTABLE_CELL_URL="$cell_url" ACCOUNTABLE_EXPECTED_RELEASE_ID="$REVISION" mise exec -- task test:cell-edge

      - name: Upload browser traces on failure
        if: failure() && inputs.phase == 'edge-smoke'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-${{ inputs.cell }}-edge-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
