name: Development runtime image

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Immutable image tag and configuration revision
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: development-runtime-image
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/require-green-ci.yml
    permissions:
      actions: read
      contents: read

  build:
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: development
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ROLE_ARN: arn:aws:iam::453722413624:role/accountable-development-apply
      IMAGE_REPOSITORY: 453722413624.dkr.ecr.eu-west-2.amazonaws.com/accountable
      REVISION: ${{ inputs.revision }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13

      - name: Request AWS apply identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const token = await core.getIDToken("sts.amazonaws.com");
            const tokenPath = path.join(process.env.RUNNER_TEMP, "aws-image-token");
            fs.writeFileSync(tokenPath, token, { mode: 0o600 });
            core.exportVariable("AWS_WEB_IDENTITY_TOKEN_FILE", tokenPath);

      - name: Create Buildx builder for attestations
        run: |
          set -euo pipefail
          docker buildx create --name accountable --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and push immutable ARM64 image
        run: |
          set -euo pipefail
          if [[ ! "$REVISION" =~ ^[-A-Za-z0-9._]{1,128}$ ]]; then
            echo "revision is invalid" >&2
            exit 2
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "${IMAGE_REPOSITORY%%/*}"
          docker buildx build --platform linux/arm64 --provenance=true --sbom=true --push --tag "$IMAGE_REPOSITORY:$REVISION" .
          digest="$(aws ecr describe-images --repository-name accountable --image-ids imageTag="$REVISION" --query 'imageDetails[0].imageDigest' --output text)"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "ECR returned an invalid image digest" >&2
            exit 1
          fi
          echo "### Development image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE_REPOSITORY@$digest\`" >> "$GITHUB_STEP_SUMMARY"
