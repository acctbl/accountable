# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    desc: Run CI locally
    cmds:
      - task: ci

  setup:
    desc: Install the exact tools and JavaScript packages for this repository
    cmds:
      - git config --local core.hooksPath .githooks
      - mise install --locked
      - pnpm install --frozen-lockfile
      - |
        if [ -n "${CI:-}" ] && [ -z "${PLAYWRIGHT_OS_DEPS_INSTALLED:-}" ]; then
          pnpm exec playwright install --with-deps chromium firefox webkit
        else
          pnpm exec playwright install chromium firefox webkit
        fi

  api:dev:
    desc: Run the API with the explicit local-development configuration
    cmds:
      - go run ./cmd/api --config "{{.ROOT_DIR}}/config/development/api.toml"

  generate:
    desc: Regenerate versioned code
    cmds:
      - buf generate
      - pnpm --filter @accountable/web generate-routes

  format:
    desc: Apply Go and Biome formatting
    cmds:
      - gofmt -w cmd internal
      - goimports -w cmd internal
      - pnpm format

  format:check:
    desc: Check formatting (Go + Biome)
    cmds:
      - |
        unformatted="$(gofmt -l cmd internal)"
        if [ -n "$unformatted" ]; then
          echo "gofmt needed on:" >&2
          echo "$unformatted" >&2
          exit 1
        fi
      - |
        unformatted="$(goimports -l cmd internal)"
        if [ -n "$unformatted" ]; then
          echo "goimports needed on:" >&2
          echo "$unformatted" >&2
          exit 1
        fi
      - pnpm format:check

  lint:
    desc: Lint Buf, Go, and JavaScript/TypeScript
    cmds:
      - buf lint
      - golangci-lint run ./cmd/... ./internal/...
      - pnpm lint

  gen:fresh:
    desc: Fail if regenerating would change generated output
    cmds:
      - |
        set -euo pipefail
        paths=(gen packages/proto/src apps/web/src/routeTree.gen.ts)
        snapshot="$(mktemp -d "${TMPDIR:-/tmp}/accountable-gen-fresh.XXXXXX")"
        cleanup() { rm -rf "$snapshot"; }
        trap cleanup EXIT

        for path in "${paths[@]}"; do
          if [ -e "$path" ]; then
            mkdir -p "$snapshot/$(dirname "$path")"
            cp -a "$path" "$snapshot/$path"
          fi
        done

        task generate

        status=0
        : >"$snapshot/diff"
        for path in "${paths[@]}"; do
          if [ -e "$snapshot/$path" ] || [ -e "$path" ]; then
            if ! diff -ru "$snapshot/$path" "$path" >>"$snapshot/diff" 2>&1; then
              status=1
            fi
          fi
        done

        if [ "$status" -ne 0 ]; then
          echo "generated output was stale; regenerate and commit the result:" >&2
          cat "$snapshot/diff" >&2
          exit 1
        fi

  compile:
    desc: Compile Go and TypeScript
    cmds:
      - go build ./...
      - pnpm typecheck

  test:unit:
    desc: Run unit tests with the Go race detector
    cmds:
      - go test -race ./... -skip Integration
      - pnpm -r --if-present test:unit

  test:component:
    desc: Run component tests
    cmds:
      - pnpm -r --if-present test:component

  test:integration:
    desc: Run integration tests in every Go package and Playwright
    cmds:
      - go test -race ./... -run Integration
      - pnpm exec playwright test tests/integration

  test:fuzz:
    desc: Run fuzz targets against the committed seed corpus only
    cmds:
      - go test -race ./... -run '^Fuzz' -count=1

  migrate:
    desc: Validate goose migrations
    cmds:
      - goose -dir db/migrations validate

  tofu:
    desc: Format-check and validate OpenTofu
    dir: infra
    cmds:
      - tofu fmt -check -recursive
      - tofu init -backend=false -input=false
      - tofu validate

  i18n:
    desc: Check localisation catalogs are extracted, valid, and complete
    cmds:
      - pnpm --filter @accountable/web i18n:check

  a11y:
    desc: Run accessibility checks
    cmds:
      - pnpm exec playwright test tests/a11y/web.spec.ts

  check:
    desc: Full mechanical gate set
    cmds:
      - task: format:check
      - task: lint
      - task: gen:fresh
      - task: compile
      - task: test:unit
      - task: test:component
      - task: test:integration
      - task: test:fuzz
      - task: migrate
      - task: tofu
      - task: i18n
      - task: a11y

  prove:negatives:
    desc: Prove each deliberate failure fails the expected gate
    cmds:
      - bash scripts/prove-negatives.sh

  security:exceptions:
    desc: Validate dated exceptions and regenerate scanner allowlists
    cmds:
      - node scripts/security/exceptions-to-allowlists.mjs

  security:gitleaks:
    desc: Scan the tree for committed secrets
    cmds:
      - bash scripts/security/gitleaks.sh

  security:govulncheck:
    desc: Fail on known Go module vulnerabilities
    cmds:
      - bash scripts/security/govulncheck.sh

  security:trivy:
    desc: Scan dependencies and OpenTofu for HIGH/CRITICAL issues
    cmds:
      - bash scripts/security/trivy.sh

  security:lockfile:
    desc: Require committed lockfiles and reject floating :latest tags
    cmds:
      - bash scripts/security/check-lockfiles.sh

  security:sbom:
    desc: Produce a CycloneDX SBOM under dist/
    cmds:
      - bash scripts/security/sbom.sh

  security:
    desc: Full security and supply-chain gate set
    cmds:
      - task: security:exceptions
      - task: security:gitleaks
      - task: security:govulncheck
      - task: security:trivy
      - task: security:lockfile
      - task: security:sbom

  prove:security:
    desc: Prove each security gate fails on a seeded finding
    cmds:
      - bash scripts/security/prove-negatives.sh

  ci:
    desc: Set up and check the repository
    deps: [setup]
    cmds:
      - task: check
      - task: prove:negatives

  ci:security:
    desc: Install tools and run security gates with negative proofs
    cmds:
      - mise install --locked
      - pnpm install --frozen-lockfile --ignore-scripts
      - task: security
      - task: prove:security

  container:parity:
    desc: Build the dev container and run the normal CI Task command inside it
    cmds:
      - |
        docker build \
          --build-arg USER_UID="$(id -u)" \
          --build-arg USER_GID="$(id -g)" \
          --file .devcontainer/Dockerfile \
          --tag accountable-devcontainer:local \
          .
      - |
        docker run --rm \
          --user root \
          --volume accountable-devcontainer-node-modules:/workspaces/accountable/node_modules \
          --volume accountable-devcontainer-admin-node-modules:/workspaces/accountable/apps/admin/node_modules \
          --volume accountable-devcontainer-web-node-modules:/workspaces/accountable/apps/web/node_modules \
          --volume accountable-devcontainer-proto-node-modules:/workspaces/accountable/packages/proto/node_modules \
          --volume accountable-devcontainer-ui-node-modules:/workspaces/accountable/packages/ui/node_modules \
          accountable-devcontainer:local \
          chown devcontainer:"$(id -g)" \
            /workspaces/accountable/node_modules \
            /workspaces/accountable/apps/admin/node_modules \
            /workspaces/accountable/apps/web/node_modules \
            /workspaces/accountable/packages/proto/node_modules \
            /workspaces/accountable/packages/ui/node_modules
      - |
        docker run --rm \
          --volume "{{.TASKFILE_DIR}}:/workspaces/accountable" \
          --volume accountable-devcontainer-home:/home/devcontainer \
          --volume accountable-devcontainer-node-modules:/workspaces/accountable/node_modules \
          --volume accountable-devcontainer-admin-node-modules:/workspaces/accountable/apps/admin/node_modules \
          --volume accountable-devcontainer-web-node-modules:/workspaces/accountable/apps/web/node_modules \
          --volume accountable-devcontainer-proto-node-modules:/workspaces/accountable/packages/proto/node_modules \
          --volume accountable-devcontainer-ui-node-modules:/workspaces/accountable/packages/ui/node_modules \
          --workdir /workspaces/accountable \
          --env CI=1 \
          accountable-devcontainer:local bash .devcontainer/parity.sh
