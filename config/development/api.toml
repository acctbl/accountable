environment = "development"
listen_address = "127.0.0.1:8080"
architecture_probe = true
allowed_origins = ["http://localhost:3000", "http://127.0.0.1:3000"]
trusted_proxy_cidrs = []
unary_rpc_timeout = "10s"
stream_rpc_timeout = "25s"
foundation_check_timeout = "30s"

[features]
provider = "noop"

[secrets]
provider = "file"
directory = "../../.local/secrets"

[database]
host = "127.0.0.1"
port = 5432
name = "accountable"
user = "postgres"
role = "postgres"
password_ref = "database.password"
tls_mode = "disable"
connect_timeout = "5s"
statement_timeout = "10s"
health_check_interval = "2s"
max_connections = 16
timezone = "UTC"

[storage]
provider = "filesystem"
root = "../../.local/storage"

[crypto]
provider = "local"
key_ref = "crypto.primary_key"

[time]
provider = "system"
max_clock_error = "1s"
max_database_skew = "1s"
