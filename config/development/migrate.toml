environment = "development"

[secrets]
provider = "file"
directory = "../../.local/secrets"

[database]
dsn_ref = "database.api_dsn"
connect_timeout = "5s"
health_check_interval = "2s"
max_connections = 16
timezone = "UTC"

[storage]
provider = "filesystem"
root = "../../.local/storage"

[crypto]
provider = "local"
key_ref = "crypto.primary_key"
