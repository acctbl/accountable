schema_version = 1
revision = "development"
environment = "development"
cell_id = "local"
aws_region = "eu-west-2"
runtime_role = "migrate"
foundation_check_timeout = "30s"
readiness_probe_interval = "2s"

[capabilities]
architecture_probe = false
postgres = true
secrets = true
kms = true
object_storage = true
telemetry = false
redpanda = false

[secrets]
provider = "file"
directory = "../../.local/secrets"

[postgres]
host = "127.0.0.1"
port = 5432
name = "accountable"
user = "postgres"
role = "postgres"
password_ref = "database.password"
tls_mode = "disable"
connect_timeout = "5s"
statement_timeout = "10s"
health_check_interval = "2s"
max_connections = 16
timezone = "UTC"

[object_storage]
provider = "filesystem"
root = "../../.local/storage"
access_purpose = "foundation-proof"

[kms]
provider = "local"
key_ref = "crypto.primary_key"
encryption_context_prefix = "accountable.foundation"

[time]
provider = "system"
max_clock_error = "1s"
max_database_skew = "1s"
